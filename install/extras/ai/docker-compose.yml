services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    environment:
      - OLLAMA_BASE_URL=http://127.0.0.1:11434
      - PORT=3000
      - HOST=127.0.0.1
    network_mode: host
    volumes:
      - ./open-webui-data:/app/backend/data
    restart: unless-stopped
