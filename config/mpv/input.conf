# ==========    Playback    ==========
SPACE        no-osd cycle pause
RIGHT        seek  5
LEFT         seek -5
Shift+RIGHT  no-osd seek  1 exact
Shift+LEFT   no-osd seek -1 exact

ctrl+q       quit
ENTER        cycle fullscreen

Alt+KP_ADD       add video-zoom  0.1
Alt+KP_SUBTRACT  add video-zoom -0.1

Bs           no-osd set speed 1;                                script-binding uosc/flash-speed

# ==========    Keyboard Multimedia Buttons    ==========
PLAY         cycle pause;                                       script-binding uosc/flash-pause-indicator
PAUSE        cycle pause;                                       script-binding uosc/flash-pause-indicator
PLAYPAUSE    cycle pause;                                       script-binding uosc/flash-pause-indicator
PLAYONLY     set pause no;                                      script-binding uosc/flash-pause-indicator
PAUSEONLY    set pause yes;                                     script-binding uosc/flash-pause-indicator
FORWARD      seek 60;                                           script-binding uosc/flash-timeline
REWIND       seek -60;                                          script-binding uosc/flash-timeline
NEXT         playlist-next;                                     script-binding uosc/flash-top-bar
PREV         playlist-prev;                                     script-binding uosc/flash-top-bar
VOLUME_UP    add volume 2
VOLUME_DOWN  add volume -2
MUTE         cycle mute;                                        script-binding uosc/flash-volume
HOME         seek 0 absolute
Shift+HOME   no-osd set playlist-pos 0
Shift+END    no-osd set playlist-pos-1 ${playlist-count}
STOP         quit
CLOSE_WIN    quit
POWER        quit
ZOOMIN       add video-zoom 0.1
ZOOMOUT      add video-zoom -0.1

# ==========    UOSC    ==========
Tab          script-binding uosc/toggle-ui
Shift+m      script-binding uosc/menu

# ==========    Mouse Bindings    ==========
MBTN_LEFT        cycle pause
MBTN_LEFT_DBL    script-binding position-aware-doubleclick      # handles seek zones AND fullscreen
MBTN_MID         cycle pause;                                   script-binding uosc/flash-pause-indicator
MBTN_RIGHT       script-binding uosc/menu-blurred

MBTN_FORWARD     playlist-next
MBTN_BACK        playlist-prev

WHEEL_UP         add volume 2;                                  script-binding uosc/flash-volume
WHEEL_DOWN       add volume -2;                                 script-binding uosc/flash-volume
WHEEL_LEFT       seek -5;                                       script-binding uosc/flash-timeline
WHEEL_RIGHT      seek 5;                                        script-binding uosc/flash-timeline

Ctrl+WHEEL_UP    script-binding positioning/cursor-centric-zoom  0.1
Ctrl+WHEEL_DOWN  script-binding positioning/cursor-centric-zoom -0.1
Ctrl+MBTN_LEFT   script-binding positioning/drag-to-pan

# ==========    File    ==========
p           script-binding uosc/open-file                      #! File > Open file
Ctrl+v      loadfile ${clipboard/text} append-play; show-text '+ ${clipboard/text}'  #! File > Open file or URL from Clipboard
h           script-binding memo-history                         #! File > Open Recent
Shift+o     script-binding uosc/load-subtitles                 #! File > Open subtitles
Ctrl+r      script-binding reload/reload_resume                 #! File > Reload
w           script-binding uosc/show-in-directory              #! File > Show in directory

# ==========    Aspect Ratio Cycle    ==========
# Cycles: Default (auto) → 16:9 → 4:3 → 2.35:1 → 21:9 → back to Default
# Note: 'w' for show-in-directory has been moved; see File section above
e           cycle-values video-aspect-override "no" "16:9" "4:3" "2.35:1" "21:9"; show-text "Aspect: ${video-aspect-override}"  #! Video > Aspect ratio > Cycle

>           script-binding uosc/next                           #! File > Playlist Next
<           script-binding uosc/prev                           #! File > Playlist Previous
L           cycle-values loop-file inf no; show-text "Loop: ${loop-file}"  #! File > Toggle loop
l           ab-loop                                            #! File > Set/Clear A-B loop points

# ==========    Window    ==========
Alt+t       cycle ontop                                        #! Window > Always on Top
Alt+p       script-message cycle-commands "apply-profile pip" "apply-profile pip-off"  #! Window > PiP
Alt+1       set window-scale 0.5                               #! Window > Scale > 50%
Alt+2       set window-scale 1.0                               #! Window > Scale > 100%
Alt+3       set window-scale 2.0                               #! Window > Scale > 200%

# ==========    Video    ==========
-           cycle video                                        #! Video > Cycle Video
Alt+i       cycle interpolation; set user-data/interpolation-on ${interpolation}; show-text "Interpolation: ${interpolation}"  #! Video > Toggle Interpolation
D           cycle deband                                       #! Video > Toggle Deband
d           cycle deinterlace                                  #! Video > Toggle Deinterlace
SHARP       set hwdec auto-copy; vf toggle deblock=filter=weak:block=4  #! Video > Deblock
$           set hwdec auto-copy; vf toggle format=colorlevels=limited  #! Video > Set Limited color range
!           set hwdec auto-copy; vf toggle vflip               #! Video > Flip > Vertical
@           set hwdec auto-copy; vf toggle hflip               #! Video > Flip > Horizontal
Ctrl+RIGHT  cycle-values video-rotate 0 90 180 270            #! Video > Rotate > Clockwise
Ctrl+LEFT   cycle-values video-rotate 0 270 180 90            #! Video > Rotate > Anti-Clockwise

# ==========    Audio    ==========
y           script-binding quality_menu/audio_formats_toggle   #! Audio > Select Audio Track
a           cycle audio                                        #! Audio > Cycle Audio
m           no-osd cycle mute;                                 script-binding uosc/flash-volume  #! Audio > Mute
0           no-osd add volume  2;                              script-binding uosc/flash-volume  #! Audio > Volume Up
9           no-osd add volume -2;                              script-binding uosc/flash-volume  #! Audio > Volume Down
UP          add volume 2
DOWN        add volume -2

# ==========    Subtitles    ==========
j           script-binding uosc/subtitles                      #! Subtitles > Select Subtitle Track
s           cycle sub                                          #! Subtitles > Cycle subtitles
k           cycle secondary-sid                                #! Subtitles > Cycle secondary subtitles
v           cycle sub-visibility                               #! Subtitles > Toggle visibility
V           cycle secondary-sub-visibility                     #! Subtitles > Toggle secondary subtitles visibility
u           cycle-values sub-ass-override "force" "yes"        #! Subtitles > Toggle overriding ASS subtitle styles
Ctrl+Shift+r  sub-reload; show-text "Subtitles Reloaded"      #! Subtitles > Reload subtitles
Shift+g     add sub-scale +0.05                               #! Subtitles > Bigger
Shift+f     add sub-scale -0.05                               #! Subtitles > Smaller
z           add sub-delay -0.042                               #! Subtitles > Main > Shift 42ms earlier
x           add sub-delay +0.042                               #! Subtitles > Main > Delay by 42ms
r           add sub-pos -1                                    #! Subtitles > Main > Move up
t           add sub-pos +1                                    #! Subtitles > Main > Move down
Z           add secondary-sub-delay -0.042                    #! Subtitles > Secondary > Shift 42ms earlier
X           add secondary-sub-delay  0.042                    #! Subtitles > Secondary > Delay by 42ms
R           add secondary-sub-pos -1                          #! Subtitles > Secondary > Move up
T           add secondary-sub-pos +1                          #! Subtitles > Secondary > Move down
Shift+BS    set sub-pos 100; set sub-scale 1.0; set sub-delay 0; show-text "Subtitle settings reset"  #! Subtitles > Reset subtitle settings
Alt+y       script-binding ytsub/auto                         #! Subtitles > YouTube Autosubs > Auto
Alt+shift+y script-binding ytsub/load                         #! Subtitles > YouTube Autosubs > Manual

# ==========    Other    ==========
           #! Playlist
c           script-binding uosc/chapters                      #! Chapters

# ==========    Miscellaneous    ==========
Shift+s     async screenshot                                  #! Miscellaneous > Screenshot
Shift+v     async screenshot video                            #! Miscellaneous > Screenshot (no subtitles)
Ctrl+s      async screenshot window                           #! Miscellaneous > Screenshot (window)
?           script-binding uosc/keybinds                      #! Miscellaneous > Show key bindings
i           script-binding stats/display-stats                #! Miscellaneous > Display stats
Shift+i     script-binding stats/display-stats-toggle         #! Miscellaneous > Toggle stats
`           script-binding commands/open                      #! Miscellaneous > Open console
Ctrl+w      script-binding uosc/open-config-directory         #! Miscellaneous > Open config folder

# ==========    Quitting    ==========
q           quit                                              #! Quit
Shift+q     quit_watch_later                                  #! Quit saving position
ESC         set fullscreen no

# ==========    Anime4K Shaders    ==========
CTRL+1 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_M.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_S.glsl"; show-text "Anime4K: Mode A — sharp lines"
CTRL+2 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_Soft_M.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_S.glsl"; show-text "Anime4K: Mode B — soft/blurry"
CTRL+3 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Upscale_Denoise_CNN_x2_M.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_S.glsl"; show-text "Anime4K: Mode C — noisy/compressed"
CTRL+0 no-osd change-list glsl-shaders clr ""; show-text "Anime4K: Off"