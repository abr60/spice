[hd] # 720p/1080p
glsl-shaders-clr
profile=HighQuality
profile-cond=((width ==1920 and height ==1080) or (height >=720 and height <1440))

[sdtv-ntsc] # SD sources (480p/540p/576p)
glsl-shaders-clr
profile=HighQuality
profile-cond=((height ==480) or (height ==540) or (height ==576))

[HighQuality]
glsl-shaders-clr                        # fixed: now clears stale shaders before applying profile
scale=ewa_lanczossharp
cscale=lanczos
dscale=catmull_rom
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes
hdr-compute-peak=no
hdr-peak-percentile=99.995
hdr-contrast-recovery=0.30
allow-delayed-peak-detect=yes

[Fast]
glsl-shaders-clr
scale=bilinear
cscale=bilinear
dscale=bilinear
correct-downscaling=no
linear-downscaling=no
sigmoid-upscaling=no
hdr-compute-peak=no
hdr-peak-percentile=100
hdr-contrast-recovery=0.0
allow-delayed-peak-detect=no
dither=no

[interpolation-activate]
# Fixed: profile-cond now keys off a user-data flag set by the Alt+i toggle,
# avoiding the previous circular condition where the profile set the same
# property it was conditioned on.
profile-cond=get("user-data/interpolation-on", false)
profile-restore=copy-equal
video-sync=display-resample
interpolation=yes

[extension.gif]
save-position-on-quit=no
loop-file=inf
no-cache

[pip]
ontop
on-all-workspaces
no-force-window-position
geometry=100%:100%
autofit=30%x30%

[pip-off]
no-ontop
no-on-all-workspaces
geometry=50%:50%
autofit=75%x75%

# Stereo downmix for 5.1 sources — comment out profile-cond if you have a surround system
[Downmix_Audio_5_1]
profile-restore=copy-equal
profile-cond=(p["audio-params/channel-count"] == 6)
af=lavfi="lowpass=c=LFE:f=120,volume=1.6,pan=stereo|FL=0.5*FC+0.707*FL+0.707*BL+0.5*LFE|FR=0.5*FC+0.707*FR+0.707*BR+0.5*LFE"

# Stereo downmix for 7.1 sources
[Downmix_Audio_7_1]
profile-restore=copy-equal
profile-cond=(p["audio-params/channel-count"] == 8)
af=lavfi="lowpass=c=LFE:f=120,volume=1.6,pan=stereo|FL=0.5*FC+0.3*FLC+0.3*FL+0.3*BL+0.3*SL+0.5*LFE|FR=0.5*FC+0.3*FRC+0.3*FR+0.3*BR+0.3*SR+0.5*LFE"

[wallpaper]
profile=Fast
glsl-shaders-clr
deband=no
temporal-dither=no
dither=no
tone-mapping=clip
# tone-mapping-desat removed: option dropped in mpv v0.39+
hdr-compute-peak=no
cache=no
demuxer-readahead-secs=5
demuxer-max-bytes=50MiB
demuxer-max-back-bytes=10MiB
loop-file=inf
audio=no
save-position-on-quit=no
vf=fps=24
