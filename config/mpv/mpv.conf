# ==========================================
# 1. WINDOW & FULLSCREEN
# ==========================================
include = ~~/profiles.conf

fs                  = yes
keepaspect          = yes
force-window        = immediate

# Wayland/Hyprland (Omarchy): use native Wayland context
# x11-bypass-compositor removed — irrelevant on Wayland
gpu-context         = auto

# ontop removed from global — use Alt+t to toggle on demand

# ==========================================
# 2. PLAYBACK & RESUME
# ==========================================
video-aspect-override = 16:9              # forced 16:9 (preferred); 'e' cycles ratios on the fly
save-position-on-quit = yes
watch-later-directory = ~/.local/state/mpv/watch_later/
keep-open           = always
watch-later-options = start,sid,sub-pos,sub-margin-y

# ==========================================
# 3. VIDEO — Intel Iris Xe + Wayland + gpu-next
# ==========================================
profile             = gpu-hq

vo                  = gpu-next
gpu-api             = vulkan            # Tiger Lake: stable Vulkan on Arch/Wayland
hwdec               = vaapi             # Intel VA-API: AV1, HEVC, H.264 all HW decoded

# Scalers
scale               = ewa_lanczossharp
cscale              = ewa_lanczossharp
dscale              = mitchell

scale-antiring      = 0.7
cscale-antiring     = 0.7
sigmoid-upscaling   = yes
correct-downscaling = yes
linear-downscaling  = no

# Dithering
dither-depth        = auto              # fixed: was 10; auto reads actual display bit depth
dither              = fruit
dither-size-fruit   = 6
temporal-dither     = yes
temporal-dither-period = 3

# Debanding
deband              = yes
deband-iterations   = 2
deband-threshold    = 3.0
deband-range        = 16
deband-grain        = 6

# Tone-mapping
tone-mapping        = bt.2446a
tone-mapping-param  = 1.0
target-colorspace-hint = no             # prevents washed-out colors in fullscreen on Wayland

# ==========================================
# 4. SUBTITLES
# ==========================================
sub-font            = "EB Garamond, Noto Serif Bengali, sans-serif"
sub-font-size       = 51
sub-bold            = yes

sub-color           = '#F7E3AC'         # warm creamy gold
sub-border-size     = 3.5
sub-border-color    = '#0A0A0A'
sub-shadow-offset   = 1.8
sub-shadow-color    = '#000000BB'
sub-back-color      = '#00000066'

sub-pos             = 100
sub-margin-y        = 48
sub-align-x         = center
sub-align-y         = bottom

blend-subtitles     = yes
sub-ass-override    = force               # fixed: was 'force'; use 'u' keybind to toggle to force when needed

sub-file-paths      = .subtitles:subs:Subtitles:Subs:ass:srt:sub

# ==========================================
# 5. AUDIO
# ==========================================
# Tighter frame (150ms) for better dialogue tracking; p=0.9 for stronger normalization
af                  = lavfi=[dynaudnorm=f=150:r=0.9:p=0.9]
volume-max          = 120
audio-pitch-correction = yes

# ==========================================
# 6. CACHE & STREAMING
# ==========================================
cache               = auto
demuxer-max-bytes   = 600MiB
demuxer-max-back-bytes = 300MiB
demuxer-readahead-secs = 120
cache-pause         = no

# AV1 preferred (HW decoded on Iris Xe), fallback to best available up to 4K/60
ytdl-format         = bestvideo[vcodec^=av01][height<=?2160][fps<=?60]+bestaudio/bestvideo[height<=?2160][fps<=?60]+bestaudio/best
ytdl-raw-options    = sub-lang="eng,en,ara,jp"

# ==========================================
# 7. LANGUAGES
# ==========================================
alang               = eng,en,en-US,ja
slang               = eng,en,en-US,ara

# ==========================================
# 8. UI & OSD — uosc
# ==========================================
osc                 = no
osd-bar             = no
border              = no
cursor-autohide     = 150
osd-level           = 1
msg-level           = all=warn,hook=no

osd-font            = "FiraCode Nerd Font"
osd-font-size       = 36
osd-bold            = yes

# ==========================================
# 9. MISC
# ==========================================
hr-seek             = yes
force-seekable      = yes
image-display-duration = inf
video-output-levels = full
screenshot-format   = png
screenshot-high-bit-depth = yes
screenshot-tag-colorspace = yes
screenshot-png-compression = 4
screenshot-dir      = "~/Pictures/mpv"
