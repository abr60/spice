# MPD Configuration

# Directories
music_directory         "~/Music"
playlist_directory      "~/.local/share/mpd/playlists"
db_file                 "~/.local/share/mpd/database"
state_file              "~/.local/share/mpd/state"
sticker_file            "~/.local/share/mpd/sticker.sql"

# Network
bind_to_address         "127.0.0.1"
port                    "6600"

# Input
input {
    plugin "curl"
}

# Audio - PipeWire
audio_output {
    type    "pipewire"
    name    "PipeWire Sound Server"
}

# Audio - FIFO (cava)
audio_output {
    type    "fifo"
    name    "cava"
    path    "/tmp/mpd.fifo"
    format  "44100:16:2"
}

# ReplayGain
replaygain              "auto"

# Stay paused across restarts instead of auto-resuming
restore_paused           "yes"

# General
auto_update             "yes"
auto_update_depth       "3"
follow_outside_symlinks "yes"
follow_inside_symlinks  "yes"
log_level               "error"